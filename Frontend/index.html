<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Expense Tracker</h1>
      <div class="card shadow p-4 mb-4">
        <h3 class="mb-3">Add New Expense</h3>
        <form id="expense-form">
          <div class="mb-3">
            <label for="amount" class="form-label"> Expense Amount </label>
            <input
              type="number"
              class="form-control"
              id="amount"
              name="amount"
              placeholder="Enter expense amount"
              min="0.01"
              step="0.01"
              required
            />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label"> Description</label>
            <input
              type="text"
              class="form-control"
              id="description"
              name="description"
              placeholder="Enter expense description"
              required
            />
          </div>
          <div class="mb-3">
            <label for="category" class="form-label"> Category</label>
            <select class="form-select" id="category" name="category" required>
              <option value="" selected disabled>Choose a category</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Education">Education</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            Add Expense
          </button>
        </form>
      </div>
      <div class="card shadow p-4">
        <h3 class="mb-3">List of Expenses</h3>
        <ul id="expense-list" class="list-group"></ul>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
